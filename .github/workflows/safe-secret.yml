name: Are Secrets Hidden?

on:
  workflow_dispatch:

jobs:
  print-secrets:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Log secrets
        env:
          SAMPLE_REPO_SECRET: ${{ secrets.SAMPLE_REPO_SECRET }}
          SAMPLE_ENV_SECRET: ${{ secrets.SAMPLE_ENV_SECRET }}
        run: |
          echo "Repo secret:        $SAMPLE_REPO_SECRET"
          echo "Environment secret: $SAMPLE_ENV_SECRET"
